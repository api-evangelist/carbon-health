description: Carbon Health is a technology-enabled healthcare provider offering primary, urgent, virtual,
  and pediatric care through in-person clinics and telemedicine across the United States. It operates on
  its own clinical technology platform (CarbyOS) and offers services including same-day appointments,
  cold/flu/COVID testing, STI/STD testing, sports physicals, occupational and workplace health, and
  clinical research for sponsors. Carbon Health was surfaced as a portfolio company of 500 Global and DCVC
  and added to the API Evangelist network. No public developer API, OpenAPI, or FHIR patient-access
  surface was found during enrichment; this profile captures the company identity, public web properties,
  and domain-security posture.
